server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route 1: Điều hướng các yêu cầu /identity/** về Identity Service (port 8080)
        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**
          filters:
            # Loại bỏ tiền tố /identity trước khi forward đến Identity Service
            - StripPrefix=1

        # Route 2: Điều hướng các yêu cầu /product/** về Product Service giả lập (port 8080)
        - id: product-service
          uri: http://localhost:8080
          predicates:
            - Path=/product/**
          filters:
            # Loại bỏ tiền tố /product trước khi forward
            - StripPrefix=1

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
